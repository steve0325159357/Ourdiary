            <Tape color="var(--accent)" style={{ top: -8, left: '50%', marginLeft: -32 }} />
            <div style={{ fontSize: 18, lineHeight: 1.7, whiteSpace: 'pre-wrap', textWrap: 'pretty' }}>{it.text}</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 14, fontSize: 12.5, color: 'rgba(75,58,47,.7)' }}>
              {mood && <><Ms n={mood[1]} s={20} f style={{ color: mood[2] }} />{mood[0]}</>}
              <span style={{ flex: 1 }} /><Who a={it.author} settings={settings} /><span>{agoText(it.createdAt)}</span>
            </div>
          </div>
        )}
        {it.type === 'proposal' && (
          <div style={{ display: 'flex', gap: 16, marginBottom: 18 }}>
            <DateBlock date={it.date} big />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6 }}><Who a={it.author} settings={settings} /><span className="muted" style={{ fontSize: 12.5 }}>的約會提議・{agoText(it.createdAt)}</span></div>
              <h2 style={{ margin: '0 0 8px', fontSize: 22, lineHeight: 1.3 }}>{it.title}</h2>
              <div className="muted" style={{ fontSize: 13.5, display: 'flex', flexDirection: 'column', gap: 4, marginBottom: 10 }}>
                {it.date && <span><Ms n="event" s={16} /> {fmt(it.date).full}（週{fmt(it.date).wk}）{it.time} {daysUntil(it.date) >= 0 ? `・${dueText(daysUntil(it.date))}` : ''}</span>}
                {it.place && <span><Ms n="location_on" s={16} /> {it.place.name}{it.place.addr ? `・${it.place.addr}` : ''}</span>}
              </div>
              {it.text && <div style={{ fontSize: 15, lineHeight: 1.65, marginBottom: 12, whiteSpace: 'pre-wrap' }}>{it.text}</div>}
              <Rsvp it={it} who={who} settings={settings} onRsvp={onRsvp} onMemorize={onMemorize} />
            </div>
          </div>
        )}
        {(it.type === 'todo' || it.type === 'quest') && (
          <div style={{ marginBottom: 18 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
              {it.type === 'quest' && <span className="quest-ic"><Ms n={QUEST_CATS[it.qcat] || 'favorite'} s={18} f /></span>}
              {it.type === 'quest' && <span className="muted" style={{ fontSize: 13 }}>{it.qcat}・</span>}
              <Who a={it.author} settings={settings} /><span className="muted" style={{ fontSize: 12.5 }}>新增於 {agoText(it.createdAt)}</span>
            </div>
            <h2 style={{ margin: '0 0 10px', fontSize: 22, lineHeight: 1.35, textDecoration: it.done && it.type === 'todo' ? 'line-through' : 'none' }}>{it.title}</h2>
            {it.text && <div style={{ fontSize: 15, lineHeight: 1.65, marginBottom: 10, whiteSpace: 'pre-wrap' }}>{it.text}</div>}
            <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
              <button className={'btn ' + (it.done ? 'ghost' : 'primary')} onClick={() => onToggle(it)} style={{ boxShadow: 'none' }}>
                <Ms n={it.done ? 'undo' : 'task_alt'} s={18} />{it.done ? '取消完成' : (it.type === 'quest' ? '我們完成了！' : '標記完成')}
              </button>
              <DueChip date={it.date} done={it.done} />
              {it.done && it.doneAt && <span className="muted" style={{ fontSize: 12.5 }}>{fmt(it.doneAt).full} 由 {settings[it.doneBy] || ''} 勾選完成</span>}
            </div>
          </div>
        )}
        {canMemo && <button className="btn ghost" style={{ width: '100%', marginBottom: 16 }} onClick={() => onMemorize(it)}><Ms n="auto_stories" s={18} />寫成一段回憶，收進「我們一起走過的⋯」</button>}

        <div className="dashed" style={{ paddingTop: 14 }}>
          <div className="label" style={{ marginBottom: 10 }}><Ms n="forum" s={16} />兩個人的悄悄話 {it.replies && it.replies.length ? `（${it.replies.length}）` : ''}</div>
          {(!it.replies || !it.replies.length) && <div className="muted" style={{ fontSize: 13.5, padding: '6px 0 4px' }}>還沒有留言，在下面寫點什麼吧。</div>}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {(it.replies || []).map(r => (
              <div key={r.id} style={{ display: 'flex', flexDirection: 'column', alignItems: r.author === who ? 'flex-end' : 'flex-start', gap: 3 }}>
                <div className={'bubble ' + (r.author === who ? 'mine' : 'theirs')}>{r.text}</div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 11, color: 'var(--faint)' }}><Who a={r.author} settings={settings} sm />{agoText(r.at)}</div>
              </div>
            ))}
            <div ref={endRef} />
          </div>
        </div>
      </div>
    </Sheet>
  );
}

function BoardEditor({ initial, presetType, who, settings, onSave, onClose }) {
  const isEdit = !!(initial && initial.id);
  const toast = useToast();
  const [it, setIt] = React.useState(() => initial ? { ...initial } : {
    type: presetType || 'note', title: '', text: '', color: NOTE_COLORS[(Math.random() * NOTE_COLORS.length) | 0], mood: '開心',
    date: presetType === 'proposal' ? addDaysIso(7) : '', time: presetType === 'proposal' ? '18:00' : '', place: null, qcat: '一起做菜',
  });
  const [hasDate, setHasDate] = React.useState(() => !!(initial ? initial.date : presetType === 'proposal'));
  const [searchOpen, setSearchOpen] = React.useState(false);
  const set = (k, v) => setIt(o => ({ ...o, [k]: v }));
  const t = it.type;
  const partner = settings[partnerOf(who)];
  const setType = (k) => { setIt(o => ({ ...o, type: k, time: k === 'proposal' && !o.time ? '18:00' : o.time })); if (k === 'proposal' && !hasDate) { setHasDate(true); setIt(o => ({ ...o, date: o.date || addDaysIso(7) })); } };
  const save = () => {
    const ok = t === 'note' ? it.text.trim() : it.title.trim();
    if (!ok) { toast(t === 'note' ? '先寫點什麼吧' : '幫它取個標題吧', 'edit'); return; }
    onSave({ ...it, date: hasDate ? it.date : '', time: hasDate && t === 'proposal' ? it.time : '' });
  };
  const sec = { padding: '16px 16px 4px' };
  return (
    <Sheet title={isEdit ? `編輯${BTYPES[t].l}` : '寫進約會聯絡簿'} onClose={onClose}
      foot={<><button className="btn ghost" style={{ flex: 1 }} onClick={onClose}>取消</button><button className="btn primary" style={{ flex: 2 }} onClick={save}><Ms n="send" s={18} f />{isEdit ? '儲存修改' : `放進聯絡簿，告訴${partner}`}</button></>}>
      {!isEdit && (
        <div style={{ padding: '14px 16px 0', display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 6 }}>
          {Object.entries(BTYPES).map(([k, T]) => (
            <button key={k} onClick={() => setType(k)} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, padding: '10px 2px', borderRadius: 10, fontSize: 13, fontWeight: 700,
              background: t === k ? 'var(--surface)' : 'transparent', border: `1.5px solid ${t === k ? T.c : 'var(--line)'}`, color: t === k ? 'var(--ink)' : 'var(--sub)', boxShadow: t === k ? '0 4px 10px rgba(75,58,47,.08)' : 'none' }}>
              <span style={{ width: 34, height: 34, borderRadius: 10, background: t === k ? T.c : 'var(--bg2)', color: t === k ? '#fff' : 'var(--sub)', display: 'grid', placeItems: 'center' }}><Ms n={T.icon} s={20} f /></span>{T.l}
            </button>
          ))}
        </div>
      )}
      {!isEdit && <div className="muted" style={{ padding: '8px 16px 0', fontSize: 12.5 }}>{BTYPES[t].hint}</div>}

      {t === 'note' ? (
        <>
          <div style={sec}>
            <div className="label"><Ms n="edit" s={16} />想說的話</div>
            <textarea className="field" rows={4} value={it.text} onChange={(e) => set('text', e.target.value)} placeholder={`想對${partner}說的話、今天的心情⋯`} style={{ background: it.color, borderColor: 'transparent', fontSize: 16 }} />
          </div>
          <div style={sec}>
            <div className="label"><Ms n="palette" s={16} />便利貼顏色</div>
            <div style={{ display: 'flex', gap: 10 }}>{NOTE_COLORS.map(c => <button key={c} onClick={() => set('color', c)} style={{ width: 36, height: 36, borderRadius: 8, background: c, border: it.color === c ? '2.5px solid var(--ink)' : '1px solid var(--line)', transform: it.color === c ? 'rotate(-6deg)' : 'none', transition: 'transform .2s' }} />)}</div>
          </div>
          <div style={{ ...sec, paddingBottom: 20 }}>
            <div className="label"><Ms n="mood" s={16} />現在的心情</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 6 }}>
              {MOODS.map(([l, ic, c]) => (
                <button key={l} onClick={() => set('mood', l)} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, padding: '7px 0', borderRadius: 10, fontSize: 11.5, background: it.mood === l ? c + '2E' : 'var(--surface)', border: `1.5px solid ${it.mood === l ? c : 'var(--line)'}` }}>
                  <Ms n={ic} s={22} f style={{ color: c }} />{l}
                </button>
              ))}
            </div>
          </div>
        </>
      ) : (
        <>
          <div style={sec}>
            <div className="label"><Ms n="edit" s={16} />{t === 'proposal' ? '想去哪、做什麼' : t === 'quest' ? '想一起完成的事' : '要做的事'}</div>
            <input className="field" value={it.title} onChange={(e) => set('title', e.target.value)} placeholder={t === 'proposal' ? '例如：週末去象山看夜景' : t === 'quest' ? '例如：一起看一次日出' : '例如：訂餐廳、買禮物'} />
          </div>
          {t === 'quest' && (
            <div style={sec}>
              <div className="label"><Ms n="sell" s={16} />任務類型</div>
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                {Object.entries(QUEST_CATS).map(([k, ic]) => (
                  <button key={k} className={'chip' + (it.qcat === k ? ' on' : '')} style={it.qcat === k ? { background: 'var(--sky)' } : {}} onClick={() => set('qcat', k)}><Ms n={ic} s={16} f />{k}</button>
                ))}
              </div>
            </div>
          )}
          {t === 'proposal' && (
            <div style={sec}>
              <div className="label"><Ms n="location_on" s={16} />地點（可選）</div>
              {it.place ? (
                <div className="card" style={{ padding: '8px 10px', boxShadow: 'none', display: 'flex', alignItems: 'center', gap: 8 }}>
                  <Ms n="location_on" s={20} f style={{ color: 'var(--terra)' }} />
                  <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontWeight: 700 }}>{it.place.name}</div>{it.place.addr && <div className="muted ellipsis" style={{ fontSize: 12 }}>{it.place.addr}</div>}</div>
                  <button className="btn ghost sm" onClick={() => set('place', null)}>移除</button>
                </div>
              ) : searchOpen ? (
                <PlaceSearch compact autoFocus onSelect={(p) => { set('place', p); setSearchOpen(false); }} />
              ) : (
                <div style={{ display: 'flex', gap: 8 }}>
                  <input className="field" placeholder="直接輸入地點名稱" onBlur={(e) => e.target.value.trim() && set('place', { name: e.target.value.trim() })} onKeyDown={(e) => { if (e.key === 'Enter' && e.target.value.trim()) set('place', { name: e.target.value.trim() }); }} />
                  <button className="btn ghost" onClick={() => setSearchOpen(true)}><Ms n="search" s={18} />搜尋地圖</button>
                </div>
              )}
            </div>
          )}
          <div style={sec}>
            <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 14.5, cursor: 'pointer' }}>
              <input type="checkbox" checked={hasDate} onChange={(e) => { setHasDate(e.target.checked); if (e.target.checked && !it.date) set('date', addDaysIso(t === 'proposal' ? 7 : 3)); }} style={{ width: 18, height: 18, accentColor: 'var(--accent)' }} />
              設定{t === 'proposal' ? '約會' : t === 'quest' ? '目標' : '待辦'}日期
            </label>
            {hasDate && (
              <div style={{ display: 'grid', gridTemplateColumns: t === 'proposal' ? '1fr 1fr' : '1fr', gap: 10, marginTop: 10 }}>
                <input type="date" className="field" value={it.date} onChange={(e) => set('date', e.target.value)} />
                {t === 'proposal' && <input type="time" className="field" value={it.time} onChange={(e) => set('time', e.target.value)} />}
              </div>
            )}
            <div className="muted" style={{ fontSize: 12, marginTop: 6, display: 'flex', alignItems: 'center', gap: 4 }}><Ms n="notifications" s={14} />日期前一週起，聯絡簿圖示會掛上小鈴鐺輕輕提醒，不會跳出打擾。</div>
          </div>
          <div style={{ ...sec, paddingBottom: 20 }}>
            <div className="label"><Ms n="notes" s={16} />{t === 'proposal' ? `想跟${partner}說的` : '補充說明（可選）'}</div>
            <textarea className="field" rows={3} value={it.text} onChange={(e) => set('text', e.target.value)} placeholder={t === 'proposal' ? '例如：穿好走的鞋，我帶熱可可！' : ''} />
          </div>
        </>
      )}
    </Sheet>
  );
}

function BoardView({ board, setBoard, settings, setSettings, who, setWho, entrySeen, compose, onMemorize }) {
  const desk = useIsDesk();
  const toast = useToast();
  const [filter, setFilter] = React.useState('all');
  const [openId, setOpenId] = React.useState(null);
  const [editing, setEditing] = React.useState(null);
  const [menu, setMenu] = React.useState(false);
  const partner = partnerOf(who);
  const whisperOn = settings.whisper !== false;

  React.useEffect(() => { if (compose) { setEditing({ type: compose.type }); } }, [compose && compose.k]);

  const now = () => Date.now();
  const upd = (id, patch) => setBoard(list => list.map(x => x.id === id ? { ...x, ...patch, updatedAt: now() } : x));
  const add = (o) => { const n = { id: Store.uid(), replies: [], done: false, text: '', title: '', date: '', time: '', ...o, author: who, createdAt: now() }; if (n.type === 'proposal') n.status = 'pending'; setBoard(list => [n, ...list]); return n; };
  const onToggle = (it) => {
    const done = !it.done;
    upd(it.id, { done, doneAt: done ? todayIso() : null, doneBy: done ? who : null });
    if (done) toast(it.type === 'quest' ? '戀愛任務達成！又一起完成了一件事' : '完成一件事了', it.type === 'quest' ? 'stars' : 'task_alt');
  };
  const onRsvp = (id, status) => {
    upd(id, { status, rsvpBy: who, rsvpAt: now() });
    toast(status === 'yes' ? `約好了！${settings[partner]} 會看到你的回覆` : status === 'maybe' ? '已回覆：再想想' : '已回覆：改天吧', status === 'yes' ? 'favorite' : 'chat');
  };
  const onReply = (id, text) => setBoard(list => list.map(x => x.id === id ? { ...x, replies: [...(x.replies || []), { id: Store.uid(), author: who, text, at: now() }] } : x));
  const onDelete = (id) => { setBoard(list => list.filter(x => x.id !== id)); setOpenId(null); toast('已刪除', 'delete'); };
  const onSave = (it) => {
    if (it.id) { upd(it.id, it); toast('已更新', 'edit'); setEditing(null); setOpenId(it.id); }
    else { const n = add(it); setEditing(null); toast(`已放進聯絡簿，${settings[partner]} 下次進來會看到`, 'send'); if (n.type !== 'note') setOpenId(null); }
  };
  const open = (it) => setOpenId(it.id);
  const isNew = (it) => isUnread(it, who, entrySeen);

  const notes = board.filter(x => x.type === 'note').sort((a, b) => b.createdAt - a.createdAt);
  const proposals = board.filter(x => x.type === 'proposal').sort((a, b) => {
    const ka = a.memorized || (a.date && daysUntil(a.date) < 0) ? 2 : !a.date ? 1 : 0, kb = b.memorized || (b.date && daysUntil(b.date) < 0) ? 2 : !b.date ? 1 : 0;
    if (ka !== kb) return ka - kb; if (ka === 2) return (b.date || '').localeCompare(a.date || ''); return (a.date || '').localeCompare(b.date || '') || b.createdAt - a.createdAt;
  });
  const todos = board.filter(x => x.type === 'todo').sort((a, b) => (a.done - b.done) || (a.done ? (b.doneAt || '').localeCompare(a.doneAt || '') : ((a.date || '9999').localeCompare(b.date || '9999') || b.createdAt - a.createdAt)));
  const quests = board.filter(x => x.type === 'quest').sort((a, b) => (a.done - b.done) || (a.done ? (b.doneAt || '').localeCompare(a.doneAt || '') : b.createdAt - a.createdAt));
  const qDone = quests.filter(q => q.done).length;
  const openIt = board.find(x => x.id === openId);

  const S = {
    proposal: (
      <BSection key="p" icon="local_activity" color="var(--her)" title="約會提議" count={proposals.filter(p => !p.memorized && !(p.date && daysUntil(p.date) < 0)).length + ' 個待約'} onAdd={() => setEditing({ type: 'proposal' })}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {proposals.map(it => <ProposalCard key={it.id} it={it} who={who} settings={settings} isNew={isNew(it)} onOpen={open} onRsvp={onRsvp} onMemorize={onMemorize} />)}
          {!proposals.length && <div className="card muted" style={{ padding: 20, textAlign: 'center', boxShadow: 'none' }}>還沒有提議，邀{settings[partner]}去個地方吧！</div>}
        </div>
      </BSection>
    ),
    note: (
      <BSection key="n" icon="sticky_note_2" color="var(--honey)" title="便利貼牆" count={notes.length + ' 張'}>
        <div className="sticky-wall">
          <button className="sticky sticky-add" onClick={() => setEditing({ type: 'note' })}><Ms n="add" s={28} />貼一張便利貼給{settings[partner]}</button>
          {notes.map(it => <StickyNote key={it.id} it={it} settings={settings} isNew={isNew(it)} onOpen={open} />)}
        </div>
      </BSection>
    ),
    todo: (
      <BSection key="t" icon="checklist" color="var(--accent)" title="一起的待辦" count={`${todos.filter(t => !t.done).length} 件未完成`} onAdd={() => setEditing({ type: 'todo' })}>
        <div className="card" style={{ padding: '10px 12px', boxShadow: 'none' }}>
          <QuickAdd placeholder="快速新增待辦，按 Enter 加入" onAdd={(title) => { add({ type: 'todo', title }); toast('已加入待辦', 'checklist'); }} />
          {todos.map(it => <TodoRow key={it.id} it={it} settings={settings} isNew={isNew(it)} onOpen={open} onToggle={onToggle} />)}
          {!todos.length && <div className="muted" style={{ padding: 16, textAlign: 'center', fontSize: 13.5 }}>沒有待辦，好好約會吧！</div>}
        </div>
      </BSection>
    ),
    quest: (
      <BSection key="q" icon="stars" color="var(--sky)" title="戀愛任務清單" count={`${qDone} / ${quests.length}`} onAdd={() => setEditing({ type: 'quest' })}>
        <div style={{ marginBottom: 12 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, color: 'var(--sub)', marginBottom: 5 }}>
            <span>一起做菜、看電影、看夜景、旅行⋯慢慢完成</span><span><b className="hand" style={{ fontSize: 19, color: 'var(--accent-d)' }}>{quests.length ? Math.round(qDone / quests.length * 100) : 0}%</b></span>
          </div>
          <div className="progress"><i style={{ width: `${quests.length ? qDone / quests.length * 100 : 0}%` }} /></div>
        </div>
        <div style={{ marginBottom: 10 }}><QuickAdd placeholder="新增一個想一起完成的願望" onAdd={(title) => { add({ type: 'quest', title, qcat: '其他' }); toast('加進戀愛任務了', 'stars'); }} /></div>
        <div className="quest-grid">{quests.map(it => <QuestTile key={it.id} it={it} isNew={isNew(it)} onOpen={open} onToggle={onToggle} />)}</div>
      </BSection>
    ),
  };

  const counts = { all: board.length, note: notes.length, proposal: proposals.length, todo: todos.length, quest: quests.length };

  return (
    <div className="scroll paper" style={{ flex: 1, height: '100%' }}>
      <div style={{ maxWidth: 1180, margin: '0 auto', padding: desk ? '30px 48px 60px' : '14px 16px 120px' }}>
        <div style={{ display: 'flex', alignItems: desk ? 'flex-end' : 'flex-start', justifyContent: 'space-between', gap: 14, marginBottom: 18, flexDirection: desk ? 'row' : 'column' }}>
          <div>
            <div className="hand" style={{ fontSize: desk ? 26 : 21, color: 'var(--accent-d)', marginBottom: 4 }}>our little notebook</div>
            <h1 style={{ margin: 0, fontSize: desk ? 42 : 28, lineHeight: 1.15 }}>約會聯絡簿</h1>
            <div className="muted" style={{ fontSize: 13.5, marginTop: 6 }}>{settings.her} 和 {settings.me} 共用的小本子：留言、約會提議、待辦和戀愛任務都放這裡</div>
          </div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
            <div className="seg" title="切換目前是誰在使用">
              <span style={{ fontSize: 12.5, color: 'var(--sub)', padding: '0 6px 0 8px', alignSelf: 'center' }}>我是</span>
              {['her', 'me'].map(w => <button key={w} className={who === w ? 'on' : ''} style={who === w ? { background: w === 'her' ? 'var(--her)' : 'var(--me)' } : {}} onClick={() => setWho(w)}>{settings[w]}</button>)}
            </div>
            <button className="chip" onClick={() => { setSettings({ ...settings, whisper: !whisperOn }); toast(whisperOn ? '已關閉進站小提示（小鈴鐺仍會保留）' : '已開啟進站小提示', whisperOn ? 'notifications_off' : 'notifications'); }}>
              <Ms n={whisperOn ? 'notifications_active' : 'notifications_off'} s={16} style={{ color: whisperOn ? '#A97B2C' : 'var(--faint)' }} />進站小提示 {whisperOn ? '開' : '關'}
            </button>
            <div style={{ position: 'relative' }}>
              <button className="btn primary" onClick={() => setMenu(v => !v)}><Ms n="edit_square" s={18} />寫一筆</button>
              {menu && <>
                <div onClick={() => setMenu(false)} style={{ position: 'fixed', inset: 0, zIndex: 700 }} />

function App() {
  const desk = useIsDesk();
  const toast = useToast();
  const [records, setRecords] = React.useState(() => Store.load());
  const [settings, setSettingsS] = React.useState(() => Store.loadSettings());
  const [tab, setTabS] = React.useState(() => localStorage.getItem('us-tab') || 'map');
  const [base, setBase] = React.useState('theme');
  const [tlLayout, setTlLayout] = React.useState('calendar');
  const [editing, setEditing] = React.useState(null);
  const [viewing, setViewing] = React.useState(null);
  const [mapFocus, setMapFocus] = React.useState(null);
  const [addMenu, setAddMenu] = React.useState(false);
  const [board, setBoard] = React.useState(() => BoardStore.load());
  const [who, setWhoS] = React.useState(() => localStorage.getItem('us-who') || 'me');
  const [entrySeen, setEntrySeen] = React.useState(null);
  const [whisper, setWhisper] = React.useState(null);
  const [compose, setCompose] = React.useState(null);
  const [memoFrom, setMemoFrom] = React.useState(null);
  const [, bump] = React.useState(0);

  React.useEffect(() => { BoardStore.save(board); }, [board]);
  const setWho = (w) => { if (tab === 'board') BoardStore.setSeen(who, Date.now()); setWhoS(w); localStorage.setItem('us-who', w); };
  React.useEffect(() => {
    if (tab !== 'board') return;
    setEntrySeen(BoardStore.seen(who));
    localStorage.setItem('us-remind-' + who, Store.iso(new Date()));
    BoardStore.setSeen(who, Date.now());
    const t = setInterval(() => BoardStore.setSeen(who, Date.now()), 4000);
    return () => { clearInterval(t); BoardStore.setSeen(who, Date.now()); bump(x => x + 1); };
  }, [tab, who]);
  const unreadN = tab === 'board' ? 0 : board.filter(it => isUnread(it, who, BoardStore.seen(who))).length;
  const upList = upcomingOf(board);
  const remindAck = localStorage.getItem('us-remind-' + who) === Store.iso(new Date());
  const showBell = tab !== 'board' && (unreadN > 0 || (upList.length > 0 && !remindAck));
  React.useEffect(() => {
    const key = 'us-whisper-' + who;
    if (settings.whisper === false || sessionStorage.getItem(key) || tab === 'board') return;
    const un = board.filter(it => isUnread(it, who, BoardStore.seen(who))).length;
    const up = upList.length && !remindAck ? upList[0] : null;
    if (!un && !up) return;
    const t = setTimeout(() => { sessionStorage.setItem(key, '1'); setWhisper({ un, up, upN: upList.length }); }, 3400);
    return () => clearTimeout(t);
  }, [who]);

  const memorize = (it) => {
    const place = it.place && it.place.lat != null ? { name: it.place.name, addr: it.place.addr || '', lat: it.place.lat, lng: it.place.lng } : null;
    setMemoFrom(it.id);
    setEditing({ initial: { kind: place ? 'place' : 'life', date: it.date && it.date <= Store.iso(new Date()) ? it.date : (it.doneAt || Store.iso(new Date())), time: it.time || '', title: it.title, cat: it.type === 'quest' ? (QUEST_TO_REC[it.qcat] || '日常') : '日常', place, weather: 'sunny', temp: '', mood: '開心', rating: 5, her: '', me: '', media: [] } });
  };
  const bellBadge = <span className="nav-bell"><Ms n="notifications" s={11} f /></span>;

  const setTab = (t) => { setTabS(t); localStorage.setItem('us-tab', t); };
  const setSettings = (s) => { setSettingsS(s); Store.saveSettings(s); };
  const commit = (list) => { setRecords(list); Store.save(list); };

  const save = (r) => {
    if (r.id) { commit(records.map(x => x.id === r.id ? r : x)); toast('已更新這段回憶', 'edit'); setViewing(r.id); }
    else { const n = { ...r, id: Store.uid(), createdAt: Date.now() }; commit([n, ...records]); if (memoFrom) { setBoard(list => list.map(x => x.id === memoFrom ? { ...x, memorized: n.id, done: x.type === 'quest' ? true : x.done } : x)); setMemoFrom(null); } toast('收進「我們一起走過的…」了', 'favorite'); if (n.place && tab === 'map') setMapFocus({ ...n, k: Date.now() }); else setViewing(n.id); }
    setEditing(null);
  };
  const del = (id) => { const r = records.find(x => x.id === id); (r.media || []).forEach(m => Store.delMedia(m.id)); commit(records.filter(x => x.id !== id)); setEditing(null); setViewing(null); toast('已刪除', 'delete'); };
  const closeEditor = () => { setEditing(null); setMemoFrom(null); };
  const openAdd = (preset = {}) => { setAddMenu(false); setEditing(preset); };
  const viewingRec = records.find(r => r.id === viewing);
  const onOpen = (r) => setViewing(r.id);
  const showOnMap = (r) => { setViewing(null); setTab('map'); setTimeout(() => setMapFocus({ ...r, k: Date.now() }), 60); };

  const days = dayNoOf(Store.iso(new Date()), settings.anniv);
  const tabs = [
    ['map', '地圖', 'map'],
    ['timeline', '我們一起走過的…', 'auto_stories'],
    ['board', '約會聯絡簿', 'menu_book'],
    ['search', '快速查詢', 'manage_search'],
    ['us', '我們', 'favorite']
  ];

  return (
    <div className="app">
      {desk && (
        <header className="topbar">
          <div className="brand"><span className="hand">us ♡</span>關於妳，關於我，關於我們</div>
          <nav className="tabs">{tabs.map(([k, l, ic]) => <button key={k} className={'tab' + (tab === k ? ' on' : '')} onClick={() => setTab(k)} title={k === 'board' && showBell ? (unreadN ? `有 ${unreadN} 則新消息` : '一週內有約會或待辦') : undefined}><span className="nav-ic"><Ms n={ic} s={18} f={tab === k} />{k === 'board' && showBell && bellBadge}</span>{l}</button>)}</nav>
          <div style={{ flex: 1 }} />
          <div className="day-badge"><Ms n="favorite" s={14} f style={{ color: 'var(--her)' }} />在一起第<b>{nf(days)}</b>天</div>
          <div style={{ position: 'relative' }}>
            <button className="btn primary" onClick={() => setAddMenu(v => !v)}><Ms n="add" s={20} />新增紀錄</button>
            {addMenu && <AddMenu onPick={(k) => { if (k.startsWith('b:')) { setAddMenu(false); setTab('board'); setCompose({ type: k.slice(2), k: Date.now() }); } else openAdd({ presetKind: k }); }} onClose={() => setAddMenu(false)} desk />}
          </div>
        </header>
      )}
      <main className="main">
        {tab === 'map' && <MapView records={records} settings={settings} base={base} setBase={setBase} onOpen={onOpen} onAdd={openAdd} focus={mapFocus} />}
        {tab === 'timeline' && <TimelineView records={records} settings={settings} onOpen={onOpen} layout={tlLayout} setLayout={setTlLayout} onAdd={() => openAdd({ presetKind: 'life' })} />}
        {tab === 'board' && <BoardView board={board} setBoard={setBoard} settings={settings} setSettings={setSettings} who={who} setWho={setWho} entrySeen={entrySeen} compose={compose} onMemorize={memorize} />}
        {tab === 'search' && <SearchView records={records} settings={settings} onOpen={onOpen} />}
        {tab === 'us' && <UsView records={records} settings={settings} setSettings={setSettings} onReset={() => { if (confirm('重置後會清除你新增的紀錄與聯絡簿，確定嗎？')) { setRecords(Store.reset()); setBoard(BoardStore.reset()); toast('已重置示範資料', 'restart_alt'); } }} />}
      </main>
      {!desk && (
        <nav className="bottomnav">
          {[tabs[0], tabs[1]].map(([k, l, ic]) => <button key={k} className={'bn' + (tab === k ? ' on' : '')} onClick={() => setTab(k)}><Ms n={ic} s={24} f={tab === k} />{k === 'timeline' ? '足跡' : l}</button>)}
          <button className="bn-add" onClick={() => setAddMenu(v => !v)}><Ms n="add_location_alt" s={28} f /></button>
          {[tabs[2], tabs[3], tabs[4]].map(([k, l, ic]) => <button key={k} className={'bn' + (tab === k ? ' on' : '')} onClick={() => setTab(k)}><span className="nav-ic"><Ms n={ic} s={24} f={tab === k} />{k === 'board' && showBell && bellBadge}</span>{k === 'search' ? '查詢' : k === 'board' ? '聯絡簿' : l}</button>)}
        </nav>
      )}
      {!desk && addMenu && <AddMenu onPick={(k) => { if (k.startsWith('b:')) { setAddMenu(false); setTab('board'); setCompose({ type: k.slice(2), k: Date.now() }); } else openAdd({ presetKind: k }); }} onClose={() => setAddMenu(false)} />}

      {viewingRec && !editing && <Detail r={viewingRec} settings={settings} onClose={() => setViewing(null)} onEdit={(r) => setEditing({ initial: r })} onShowMap={showOnMap} />}
      {editing && <Editor key={editing.initial ? editing.initial.id : 'new'} initial={editing.initial} presetPlace={editing.place} presetKind={editing.presetKind} settings={settings} onSave={save} onDelete={del} onClose={closeEditor} />}

      {whisper && <Whisper data={whisper} settings={settings} who={who} onGo={() => setTab('board')} onClose={() => setWhisper(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ToastHost><App /></ToastHost>);
</script>
</body>
</html>
