<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EFE2">
<title>關於妳，關於我，關於我們</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root {
  --bg: #F6EFE2;
  --bg2: #EFE5D2;
  --surface: #FFFBF3;
  --ink: #4B3A2F;
  --sub: #8A7766;
  --faint: #B8A894;
  --line: #E6D9C3;
  --accent: #7FA88E;
  --accent-d: #5F8A70;
  --accent-l: #E3EDE3;
  --honey: #E3B566;
  --terra: #D9826B;
  --rose: #C99BA6;
  --sky: #8FB3C4;
  --her: #D98C8C;
  --me: #7FA88E;
  --font: "LXGW WenKai TC", "Noto Sans TC", sans-serif;
  --latin: "Caveat", "LXGW WenKai TC", cursive;
  --r: 8px;
  --shadow: 0 2px 0 rgba(75,58,47,.05), 0 10px 24px rgba(75,58,47,.09);
  --shadow-l: 0 16px 40px rgba(75,58,47,.18);
}
* { box-sizing: border-box; }
html, body, #root { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, textarea, select { font: inherit; color: var(--ink); }
.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; display: inline-block; line-height: 1; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; user-select: none; font-variation-settings: 'FILL' 0, 'wght' 450; }
.ms.f { font-variation-settings: 'FILL' 1, 'wght' 450; }

.paper { background-color: var(--bg); background-image: radial-gradient(rgba(75,58,47,.035) 1px, transparent 1px); background-size: 6px 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 18px; border-radius: 10px; font-weight: 700; font-size: 15px; transition: transform .12s, background .15s, box-shadow .15s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 3px 0 var(--accent-d); }
.btn.primary:hover { background: var(--accent-d); }
.btn.ghost { background: var(--surface); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--bg); }
.btn.dark { background: var(--ink); color: var(--surface); }
.btn.danger { color: var(--terra); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 4px 12px rgba(75,58,47,.1); flex-shrink: 0; transition: transform .12s; }
.icon-btn:active { transform: scale(.94); }
.icon-btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 12px; height: 34px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; white-space: nowrap; flex-shrink: 0; transition: all .15s; }
.chip.on { color: #fff; border-color: transparent; }
.chip.sm { height: 24px; padding: 0 8px; font-size: 12px; gap: 3px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.chips::-webkit-scrollbar { display: none; }
.chips-wrap { position: relative; min-width: 0; }
.chips-wrap > .chips { scroll-behavior: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; scroll-snap-type: x proximity; cursor: grab; user-select: none; }
.chips-wrap > .chips > * { scroll-snap-align: start; }
.chips-wrap > .chips.dragging { cursor: grabbing; scroll-snap-type: none; }
.chips-wrap > .chips.dragging * { pointer-events: none; }
.chips-wrap.fade-r > .chips { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 44px), transparent); }
.chips-wrap.fade-l > .chips { -webkit-mask-image: linear-gradient(90deg, transparent, #000 44px); mask-image: linear-gradient(90deg, transparent, #000 44px); }
.chips-wrap.fade-l.fade-r > .chips { -webkit-mask-image: linear-gradient(90deg, transparent, #000 44px, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(90deg, transparent, #000 44px, #000 calc(100% - 44px), transparent); }
.chips-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(75,58,47,.16); display: grid; place-items: center; color: var(--ink); z-index: 2; transition: transform .15s; }
.chips-arrow:active { transform: translateY(-50%) scale(.9); }
.chips-arrow.l { left: -4px; }
.chips-arrow.r { right: -4px; }
@media (hover: none) { .chips-arrow { width: 24px; height: 24px; opacity: .92; } }

.field { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; outline: none; font-size: 15px; }
.field:focus, textarea.field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-l); }
textarea.field { height: auto; min-height: 84px; padding: 10px 12px; line-height: 1.6; resize: vertical; }
.label { font-size: 13px; color: var(--sub); margin: 0 0 6px; display: flex; align-items: center; gap: 4px; }
.muted { color: var(--sub); }
.hand { font-family: var(--latin); }
.dashed { border-top: 1px dashed var(--line); }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ph { background: repeating-linear-gradient(135deg, color-mix(in oklab, var(--c, var(--line)) 38%, transparent) 0 7px, color-mix(in oklab, var(--c, var(--line)) 16%, transparent) 7px 14px), var(--surface); position: relative; overflow: hidden; }
.ph .ph-l { position: absolute; left: 8px; bottom: 6px; font: 500 10px/1 "JetBrains Mono", ui-monospace, monospace; color: var(--sub); }
.media-tile { position: relative; overflow: hidden; border-radius: 6px; background: var(--bg2); }
.media-tile img, .media-tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
.play-badge { position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; border-radius: 12px; background: rgba(40,30,20,.45); color: #fff; display: grid; place-items: center; }
.tape { position: absolute; width: 64px; height: 18px; opacity: .78; pointer-events: none; -webkit-mask-image: linear-gradient(90deg, transparent 0 2px, #000 2px calc(100% - 2px), transparent 0); }

/* 地圖與自訂標記 */
.leaflet-container { font-family: var(--font); background: var(--bg2); }
.map-theme .leaflet-tile-pane { filter: sepia(.18) saturate(.92) contrast(.98); }
.leaflet-control-attribution { font-size: 9px !important; background: rgba(255,251,243,.75) !important; }
.leaflet-control-zoom { display: none; }
.us-pin { background: none !important; border: 0 !important; }
.pin-wrap { display: flex; flex-direction: column; align-items: center; transform-origin: 50% 100%; transition: transform .2s cubic-bezier(.3,1.6,.5,1); filter: drop-shadow(0 3px 4px rgba(75,58,47,.28)); }
.pin-wrap.active { transform: scale(1.3); z-index: 999; }
.pin-wrap:hover { transform: scale(1.12); }
.pin-ring { width: 46px; height: 46px; border-radius: 50%; background: #fff; padding: 3px; box-shadow: 0 0 0 2.5px var(--c); }
.pin-img { width: 100%; height: 100%; border-radius: 50%; background-size: cover; background-position: center; }
.pin-img.empty { background: repeating-linear-gradient(135deg, color-mix(in oklab, var(--c) 55%, white) 0 4px, color-mix(in oklab, var(--c) 28%, white) 4px 8px); display: grid; place-items: center; color: #fff; }
.pin-tip { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 9px solid var(--c); margin-top: -1px; }
.pin-count { position: absolute; top: -4px; right: -8px; background: var(--ink); color: #fff; font-size: 10px; line-height: 16px; padding: 0 5px; border-radius: 8px; font-weight: 700; }
.pin-drop { animation: drop .45s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes drop { from { transform: translateY(-24px) scale(.6); opacity: 0 } to { transform: none; opacity: 1 } }
.me-dot { width: 18px; height: 18px; border-radius: 9px; background: #6C9BD2; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); position: relative; }
.me-dot::before { content: ''; position: absolute; inset: -12px; border-radius: 50%; background: #6C9BD2; opacity: .25; animation: pulse 2s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.5); opacity: .45 } 100% { transform: scale(1.6); opacity: 0 } }
.new-pin { filter: drop-shadow(0 4px 6px rgba(75,58,47,.3)); animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-4px); } }

/* 外層結構與導航 */
.app { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.topbar { height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 20px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 500; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; white-space: nowrap; }
.brand .hand { font-size: 26px; color: var(--accent-d); font-weight: 700; }
.tabs { display: flex; gap: 4px; }
.tab { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 999px; font-size: 14.5px; color: var(--sub); transition: all .15s; }
.tab:hover { background: var(--bg); }
.tab.on { background: var(--accent); color: #fff; font-weight: 700; }
.day-badge { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; font-size: 12.5px; color: var(--sub); }
.day-badge b { font-family: var(--latin); font-size: 20px; color: var(--ink); line-height: 1; }
.main { flex: 1; min-height: 0; position: relative; display: flex; }

.bottomnav { position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); height: 64px; z-index: 600; display: flex; align-items: center; justify-content: space-around; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 10px 30px rgba(75,58,47,.14); }
.bn { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 50px; color: var(--sub); font-size: 10.5px; }
.bn.on { color: var(--accent-d); font-weight: 700; }
.bn-add { width: 58px; height: 58px; margin-top: -28px; border-radius: 18px; background: var(--accent); color: #fff; display: grid; place-items: center; border: 4px solid var(--bg); box-shadow: 0 8px 18px rgba(95,138,112,.4); transform: rotate(-4deg); transition: transform .2s; }
.bn-add:active { transform: rotate(-4deg) scale(.92); }

/* 約會聯絡簿與微互動 */
.nav-ic { position: relative; display: inline-grid; }
.nav-bell { position: absolute; top: -7px; right: -10px; width: 17px; height: 17px; border-radius: 9px; background: var(--honey); color: #fff; display: grid; place-items: center; border: 2px solid var(--surface); box-shadow: 0 1px 3px rgba(75,58,47,.25); }
.tab.on .nav-bell { border-color: var(--accent); }
.nav-bell .ms, .bell { transform-origin: 50% 15%; animation: bellRing 6s ease-in-out 3.5s infinite; }
@keyframes bellRing { 0%, 84%, 100% { transform: rotate(0); } 86% { transform: rotate(16deg); } 89% { transform: rotate(-13deg); } 92% { transform: rotate(9deg); } 95% { transform: rotate(-5deg); } 97% { transform: rotate(2deg); } }
@media (prefers-reduced-motion: reduce) { .nav-bell .ms, .bell { animation: none; } }

.whisper { position: fixed; z-index: 900; display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-l); animation: whisperIn .45s cubic-bezier(.3,1.4,.5,1); transition: opacity .35s, transform .35s; }
.whisper.desk { top: 76px; right: 20px; width: 400px; }
.whisper.mob { top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; }
.whisper.out { opacity: 0; transform: translateY(-10px); }
@keyframes whisperIn { from { opacity: 0; transform: translateY(-14px); } }

.who-chip { display: inline-flex; align-items: center; color: #fff; font-weight: 700; padding: 2px 7px; border-radius: 8px; line-height: 1.3; white-space: nowrap; flex-shrink: 0; }
.due-chip { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--bg2); color: var(--sub); white-space: nowrap; }
.due-chip.soon { background: color-mix(in oklab, var(--honey) 26%, var(--surface)); color: #8C6420; font-weight: 700; }
.due-chip.over { background: color-mix(in oklab, var(--terra) 14%, var(--surface)); color: #A65A45; }
.new-tag { display: inline-block; font: 700 9.5px/1 "JetBrains Mono", monospace; letter-spacing: .06em; color: #fff; background: var(--terra); padding: 3px 5px; border-radius: 4px; vertical-align: 2px; transform: rotate(-3deg); }

.date-block { width: 64px; flex-shrink: 0; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; align-self: flex-start; }
.date-block .db-m { background: var(--her); color: #fff; font-size: 11.5px; font-weight: 700; padding: 3px 0; }
.date-block .db-d { font-size: 32px; font-weight: 700; line-height: 1.05; padding-top: 4px; }
.date-block .db-w { font-size: 11px; color: var(--sub); padding-bottom: 6px; }
.date-block.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 78px; color: var(--faint); font-size: 11px; border-style: dashed; }

.proposal { display: flex; gap: 14px; padding: 14px; cursor: pointer; transition: transform .2s, box-shadow .2s; }
.proposal:hover { transform: translateY(-2px); }
.rsvp { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.rsvp button { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; transition: all .15s; }
.rsvp button:hover { background: var(--bg); }
.rsvp button.on.yes, .rsvp button.yes:hover { background: var(--her); color: #fff; border-color: var(--her); }
.rsvp button.on.maybe { background: var(--honey); color: #fff; border-color: var(--honey); }
.rsvp button.on.no { background: var(--faint); color: #fff; border-color: var(--faint); }
.st-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--sub); background: var(--bg2); padding: 5px 10px; border-radius: 999px; }
.stamp { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--her); border: 2px solid var(--her); padding: 3px 10px; border-radius: 6px; transform: rotate(-4deg); background: color-mix(in oklab, var(--her) 8%, var(--surface)); }

.bsec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.bsec-head h2 { margin: 0; font-size: 20px; }
.bsec-ic { width: 30px; height: 30px; border-radius: 9px; color: #fff; display: grid; place-items: center; transform: rotate(-4deg); }

.quick-add { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 10px; border-radius: 10px; border: 1px dashed var(--line); background: var(--bg); color: var(--faint); }
.quick-add input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 14px; }
.quick-add:focus-within { border-color: var(--accent); background: var(--surface); }

.upcoming { position: relative; margin-bottom: 22px; padding: 12px 14px; border-radius: 10px; background: color-mix(in oklab, var(--honey) 14%, var(--surface)); border: 1px solid color-mix(in oklab, var(--honey) 40%, var(--line)); }
.up-item { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; flex-shrink: 0; }
.up-item b { color: #8C6420; font-size: 12px; white-space: nowrap; }

.sticky-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 22px 16px; padding-top: 8px; }
.sticky { position: relative; min-height: 150px; padding: 20px 14px 12px; border-radius: 2px 2px 16px 2px; box-shadow: 0 6px 14px rgba(75,58,47,.12); display: flex; flex-direction: column; gap: 10px; text-align: left; transition: transform .25s cubic-bezier(.3,1.5,.5,1), box-shadow .2s; }
.sticky:hover { transform: rotate(0) scale(1.03) !important; box-shadow: 0 10px 22px rgba(75,58,47,.16); }
.sticky-text { flex: 1; font-size: 15px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.sticky-add { background: transparent !important; border: 2px dashed var(--line); box-shadow: none; align-items: center; justify-content: center; color: var(--sub); font-size: 13.5px; text-align: center; }
.sticky-add:hover { border-color: var(--accent); color: var(--accent-d); }

.todo-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 2px; border-bottom: 1px dashed var(--line); }
.todo-row:last-child { border-bottom: 0; }
.check { width: 24px; height: 24px; flex-shrink: 0; border-radius: 7px; border: 2px solid var(--faint); background: var(--surface); display: grid; place-items: center; color: #fff; transition: all .2s cubic-bezier(.3,1.6,.5,1); }
.check:hover { border-color: var(--accent); }
.check.on { background: var(--accent); border-color: var(--accent); transform: rotate(-6deg) scale(1.05); }

.quest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.quest { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; overflow: hidden; transition: transform .2s; min-height: 104px; }
.quest:hover { transform: translateY(-2px); }
.quest.done { background: color-mix(in oklab, var(--sky) 10%, var(--surface)); }
.quest-ic { width: 30px; height: 30px; border-radius: 15px; background: color-mix(in oklab, var(--sky) 22%, var(--surface)); color: #5D8AA0; display: grid; place-items: center; flex-shrink: 0; }
.quest-stamp { position: absolute; right: 8px; bottom: 8px; font-size: 11px; font-weight: 700; color: var(--terra); border: 1.5px solid var(--terra); border-radius: 5px; padding: 2px 6px; transform: rotate(-8deg); background: var(--surface); }
.progress { height: 10px; border-radius: 5px; background: var(--bg2); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 5px; background: repeating-linear-gradient(45deg, var(--accent) 0 8px, color-mix(in oklab, var(--accent) 80%, white) 8px 16px); transition: width .6s cubic-bezier(.3,1.2,.5,1); }

.bubble { max-width: 80%; padding: 9px 13px; border-radius: 14px; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; }
.bubble.mine { background: var(--accent-l); border-bottom-right-radius: 4px; }
.bubble.theirs { background: color-mix(in oklab, var(--her) 16%, var(--surface)); border-bottom-left-radius: 4px; }

/* 彈窗與浮層 */
.scrim { position: fixed; inset: 0; background: rgba(60,45,35,.38); z-index: 1000; animation: fade .2s; }
@keyframes fade { from { opacity: 0 } }
.sheet { position: fixed; z-index: 1001; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
.sheet.mobile { left: 0; right: 0; bottom: 0; top: 24px; border-radius: 20px 20px 0 0; animation: up .32s cubic-bezier(.2,.9,.3,1); }
.sheet.desk { top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(760px, calc(100vw - 48px)); max-height: calc(100vh - 48px); border-radius: 14px; box-shadow: var(--shadow-l); animation: pop .25s cubic-bezier(.2,.9,.3,1); }
.sheet.desk.wide { width: min(1040px, calc(100vw - 48px)); }
@keyframes up { from { transform: translateY(100%) } }
@keyframes pop { from { transform: translate(-50%, -46%); opacity: 0 } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--surface); flex-shrink: 0; }
.sheet-head h3 { margin: 0; font-size: 18px; flex: 1; }
.sheet-foot { display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); flex-shrink: 0; }

.toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); z-index: 3000; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow-l); animation: toastIn .3s cubic-bezier(.3,1.5,.5,1); display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 32px); }
@keyframes toastIn { from { transform: translate(-50%, 20px); opacity: 0 } }

.seg { display: inline-flex; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.seg button { height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; color: var(--sub); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }

(function () {
  const LS = 'us-records-v2';
  const LS_SET = 'us-settings-v1';
  let db;

  function openDB() {
    return new Promise((res, rej) => {
      if (db) return res(db);
      const r = indexedDB.open('us-media', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('m');
      r.onsuccess = () => { db = r.result; res(db); };
      r.onerror = () => rej(r.error);
    });
  }
  async function putMedia(id, blob) {
    const d = await openDB();
    return new Promise((res, rej) => {
      const tx = d.transaction('m', 'readwrite');
      tx.objectStore('m').put(blob, id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  async function getMedia(id) {
    const d = await openDB();
    return new Promise((res) => {
      const rq = d.transaction('m').objectStore('m').get(id);
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => res(null);
    });
  }
  async function delMedia(id) {
    const d = await openDB();
    return new Promise((res) => {
      const tx = d.transaction('m', 'readwrite');
      tx.objectStore('m').delete(id);
      tx.oncomplete = () => res();
      tx.onerror = () => res();
    });
  }
  const urlCache = {};
  async function mediaUrl(id) {
    if (urlCache[id]) return urlCache[id];

  function reset() { localStorage.removeItem(LS); return load(); }

  window.Store = { load, save, loadSettings, saveSettings, reset, putMedia, getMedia, delMedia, mediaUrl, cacheUrl, uid, iso };
})();

<script>
(function () {
  var el = document.getElementById('splash');
  if (!el) return;
  try {
    var s = JSON.parse(localStorage.getItem('us-settings-v1') || '{}');
    var a = (s.anniv || '2022-05-20').split('-').map(Number);
    var t = new Date();
    var days = Math.floor((new Date(t.getFullYear(), t.getMonth(), t.getDate()) - new Date(a[0], a[1] - 1, a[2])) / 86400000) + 1;
    var d = el.querySelector('[data-days]'); if (d) d.textContent = days.toLocaleString('en-US');
  } catch (e) {}
  var MIN = 2600, start = Date.now(), loaded = document.readyState === 'complete', done = false;
  function hide() {
    if (done) return; done = true;
    el.classList.add('out');
    setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 750);
  }
  function maybe() { if (loaded) setTimeout(hide, Math.max(0, MIN - (Date.now() - start))); }
  window.addEventListener('load', function () { loaded = true; maybe(); });
  el.addEventListener('click', hide);
  setTimeout(hide, 5000);
  maybe();
})();
</script>

const TILES = {
  theme: {
    url: 'https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}',
    attr: '&copy; 內政部國土測繪中心 (通用版電子地圖)',
    sub: [],
    maxZoom: 20
  },

    url: 'https://{s}.google.com/vt/lyrs=m&hl=zh-TW&x={x}&y={y}&z={z}',
    attr: '&copy; Google Maps',

  },
};

function getEffectiveGoogleMapsKey() {
  if (typeof DEFAULT_GOOGLE_MAPS_KEY === 'string' && DEFAULT_GOOGLE_MAPS_KEY.trim()) return DEFAULT_GOOGLE_MAPS_KEY.trim();
  const s = Store.loadSettings();
  return (s.googleMapsKey && s.googleMapsKey.trim()) ? s.googleMapsKey.trim() : '';
}

let googleMapsPromise = null;
function loadGoogleMapsApi(apiKey) {
  if (window.google && window.google.maps && window.google.maps.places) return Promise.resolve(window.google.maps);
  if (!apiKey) return Promise.reject(new Error('未設定 Google Maps API Key'));
  if (googleMapsPromise) return googleMapsPromise;
  googleMapsPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=places&language=zh-TW&region=TW`;
    script.async = true;
    script.defer = true;
    script.onload = () => resolve(window.google.maps);
    script.onerror = () => { googleMapsPromise = null; reject(new Error('無法載入 Google Maps API')); };
    document.head.appendChild(script);
  });
  return googleMapsPromise;
}

const Geo = {
  async searchWithGoogle(q, apiKey, signal) {
    try {
      await loadGoogleMapsApi(apiKey);
      return new Promise((resolve) => {
        const dummyDiv = document.createElement('div');
        const service = new window.google.maps.places.PlacesService(dummyDiv);
        let resolved = false;

        const handleResolve = (res) => {
          if (resolved) return;
          resolved = true;
          resolve(res);
        };

        const timer = setTimeout(() => handleResolve([]), 4000);
        if (signal) {
          signal.addEventListener('abort', () => {
            clearTimeout(timer);
            handleResolve([]);
          });
        }

        service.textSearch({ query: q, language: 'zh-TW', location: new window.google.maps.LatLng(25.04, 121.55), radius: 50000 }, (results, status) => {
          if (resolved) return;
          clearTimeout(timer);
          if (status === window.google.maps.places.PlacesServiceStatus.OK && results && results.length) {
            handleResolve(results.slice(0, 8).map(p => ({
              name: p.name,
              addr: p.formatted_address || '',
              lat: p.geometry.location.lat(),
              lng: p.geometry.location.lng(),
              rating: p.rating,
              source: 'google'
            })));
          } else {
            handleResolve([]);
          }
        });
      });
    } catch (e) {
      return [];
    }
  },
  async searchWithArcGIS(q, signal) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);
      if (signal) {
        signal.addEventListener('abort', () => { clearTimeout(timeoutId); controller.abort(); });
      }
      const u = `https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=pjson&singleLine=${encodeURIComponent(q)}&maxLocations=5`;
      const r = await fetch(u, { signal: controller.signal });
      clearTimeout(timeoutId);
      const j = await r.json();
      return (j.candidates || []).map(c => ({
        name: c.attributes?.PlaceName || c.address || q,
        addr: c.address || '',
        lat: c.location.y,
        lng: c.location.x,
        source: 'arcgis'
      }));
    } catch (e) {
      return [];
    }
  },
  async searchWithFallback(q, signal) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);
      if (signal) {
        signal.addEventListener('abort', () => { clearTimeout(timeoutId); controller.abort(); });
      }
      const u = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lang=default&limit=5&lat=25.04&lon=121.55`;
      const r = await fetch(u, { signal: controller.signal });
      clearTimeout(timeoutId);
      const j = await r.json();
      return (j.features || []).map(f => {
        const p = f.properties || {};
        const coords = f.geometry.coordinates;
        const addrParts = [p.country, p.city || p.county, p.district, p.street, p.housenumber ? p.housenumber + '號' : ''].filter(Boolean);
        return { name: p.name || addrParts[addrParts.length - 1] || q, addr: addrParts.join('') || p.city || '', lat: coords[1], lng: coords[0], source: 'osm' };
      });
    } catch (e) { return []; }
  },
  async search(q, signal) {
    const key = getEffectiveGoogleMapsKey();
    const tasks = [];
    
    // 如果有設定金鑰，同時發送 Google Places 搜尋與 ArcGIS 搜尋
    if (key) {
      tasks.push(this.searchWithGoogle(q, key, signal));
    }
    
    // 無論如何都加入 ArcGIS 搜尋（門牌非常準）
    tasks.push(this.searchWithArcGIS(q, signal));
    
    // 如果沒有 Google Key，加入 Photon 作為備案擴充資料源
    if (!key) {
        tasks.push(this.searchWithFallback(q, signal));
    }

    const resultsArrays = await Promise.all(tasks);
    let combined = [];
    
    resultsArrays.forEach(arr => {
      if (arr && arr.length) combined = combined.concat(arr);
    });

    // 合併結果並根據「經緯度相似度」去重疊
    const unique = [];
    const seen = new Set();
    for (const r of combined) {
      if (!r.lat || !r.lng) continue;
      const locKey = `${parseFloat(r.lat).toFixed(4)},${parseFloat(r.lng).toFixed(4)}`;
      if (!seen.has(locKey)) {
        seen.add(locKey);
        unique.push(r);
      }
    }
    return unique.slice(0, 8);
  },
  async reverse(lat, lng) {
    const key = getEffectiveGoogleMapsKey();
    if (key) {
      try {
        await loadGoogleMapsApi(key);
        return new Promise((resolve) => {
          let resolved = false;
          const timer = setTimeout(() => {
            if (!resolved) { resolved = true; resolve({ name: '目前位置', addr: '' }); }
          }, 3000);
          new window.google.maps.Geocoder().geocode({ location: { lat, lng }, language: 'zh-TW' }, (results, status) => {
            if (resolved) return;
            resolved = true;
            clearTimeout(timer);
            if (status === 'OK' && results && results[0]) {
              resolve({ name: results[0].address_components[0] ? results[0].address_components[0].long_name : '目前位置', addr: results[0].formatted_address || '', source: 'google' });
            } else resolve({ name: '目前位置', addr: '' });
          });
        });
      } catch (e) {}
    }
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, { headers: { 'Accept-Language': 'zh-TW,zh;q=0.9' } });
      const j = await r.json();
      if (j && j.display_name) {
        return { name: j.name || (j.address && (j.address.road || j.address.suburb || j.address.city)) || '目前位置', addr: j.display_name, source: 'osm' };
      }
    } catch (e) {}
    return { name: '目前位置', addr: '' };
  },
  locate() {
    return new Promise((res, rej) => {
      if (!navigator.geolocation) return rej(new Error('不支援定位'));
      navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }), e => rej(e), { enableHighAccuracy: true, timeout: 10000 });
    });
  }
};

function UsMap({ records, activeId, onPick, base = 'theme', flyTo, me, draft, onDraftMove, onMapClick, onBoundsChange, padBottom = 0, padLeft = 0 }) {
  const el = React.useRef(null);
  const map = React.useRef(null);
  const tiles = React.useRef(null);
  const layer = React.useRef(null);
  const meM = React.useRef(null);
  const draftM = React.useRef(null);
  const cb = React.useRef({}); cb.current = { onPick, onDraftMove, onMapClick, onBoundsChange };

  React.useEffect(() => {
    const m = L.map(el.current, { zoomControl: false, attributionControl: true, center: [25.07, 121.56], zoom: 11 });
    map.current = m;
    layer.current = L.layerGroup().addTo(m);
    m.on('click', (e) => cb.current.onMapClick && cb.current.onMapClick(e.latlng));
    const bc = () => {
      try {
        if (cb.current.onBoundsChange) cb.current.onBoundsChange(m.getBounds());
      } catch (e) {}
    };
    m.on('moveend', bc);
    setTimeout(() => { m.invalidateSize(); bc(); }, 50);
    const ro = new ResizeObserver(() => m.invalidateSize()); ro.observe(el.current);
    window.__usMap = m;
    return () => { ro.disconnect(); m.remove(); };
  }, []);

  React.useEffect(() => {
    const t = TILES[base] || TILES.theme;
    if (tiles.current) tiles.current.remove();
    tiles.current = L.tileLayer(t.url, { attribution: t.attr, subdomains: t.sub && t.sub.length ? t.sub : 'abc', maxZoom: 20 }).addTo(map.current);
    el.current.classList.toggle('map-theme', base === 'theme');
  }, [base]);

  React.useEffect(() => {
    const g = layer.current; g.clearLayers();
    records.filter(r => r.place).forEach(r => {
      const icon = L.divIcon({ className: 'us-pin', html: pinHtml(r, r.id === activeId), iconSize: [52, 62], iconAnchor: [26, 60] });
      const mk = L.marker([r.place.lat, r.place.lng], { icon, zIndexOffset: r.id === activeId ? 1000 : 0 });
      mk.on('click', (e) => { L.DomEvent.stopPropagation(e); cb.current.onPick && cb.current.onPick(r.id); });
      g.addLayer(mk);
    });
  }, [records, activeId]);

  React.useEffect(() => {
    if (!flyTo) return;
    const m = map.current;
    const z = flyTo.zoom || Math.max(m.getZoom(), 15);
    const p = m.project([flyTo.lat, flyTo.lng], z).add([-padLeft / 2, padBottom / 2]);
    m.flyTo(m.unproject(p, z), z, { duration: .8 });
  }, [flyTo, padBottom, padLeft]);

  React.useEffect(() => {
    if (!me) { if (meM.current) { meM.current.remove(); meM.current = null; } return; }
    const icon = L.divIcon({ className: 'us-pin', html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
    if (!meM.current) meM.current = L.marker([me.lat, me.lng], { icon, interactive: false }).addTo(map.current);
    else meM.current.setLatLng([me.lat, me.lng]);
  }, [me]);

  React.useEffect(() => {
    if (!draft) { if (draftM.current) { draftM.current.remove(); draftM.current = null; } return; }
    const html = `<div class="new-pin" style="--c:var(--accent)"><div class="pin-wrap" style="--c:var(--accent)"><div class="pin-ring"><div class="pin-img empty"><span class="ms f" style="font-size:22px">favorite</span></div></div><div class="pin-tip"></div></div></div>`;
    const icon = L.divIcon({ className: 'us-pin', html, iconSize: [52, 62], iconAnchor: [26, 60] });
    if (!draftM.current) {
      draftM.current = L.marker([draft.lat, draft.lng], { icon, draggable: true, zIndexOffset: 2000 }).addTo(map.current);
      draftM.current.on('dragend', (e) => cb.current.onDraftMove && cb.current.onDraftMove(e.target.getLatLng()));
    } else draftM.current.setLatLng([draft.lat, draft.lng]);
  }, [draft]);

  return <div ref={el} style={{ position: 'absolute', inset: 0 }} />;
}

function makeThumb(file, size = 160) {
  return new Promise((res) => {
    const draw = (src, w, h) => {
      const c = document.createElement('canvas'); const s = Math.min(w, h);
      c.width = c.height = size;
      c.getContext('2d').drawImage(src, (w - s) / 2, (h - s) / 2, s, s, 0, 0, size, size);
      try { res(c.toDataURL('image/jpeg', .72)); } catch (e) { res(null); }
    };
    const url = URL.createObjectURL(file);
    if (file.type.startsWith('video')) {
      const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
      v.onloadeddata = () => { v.currentTime = Math.min(.5, (v.duration || 1) / 3); };
      v.onseeked = () => draw(v, v.videoWidth, v.videoHeight);
      v.onerror = () => res(null);
      setTimeout(() => res(null), 6000);
    } else {
      const i = new Image(); i.onload = () => draw(i, i.naturalWidth, i.naturalHeight); i.onerror = () => res(null); i.src = url;
    }
  });
}

    setLocBusy(true);
    try {
      const p = await Geo.locate();
      const info = await Geo.reverse(p.lat, p.lng);
      set('place', { ...info, lat: p.lat, lng: p.lng, acc: p.acc });
      toast(`已定位（誤差約 ${Math.round(p.acc)} 公尺）`, 'my_location');
    } catch (e) { toast(e.code === 1 ? '請允許瀏覽器存取位置' : '定位失敗，可改用搜尋', 'location_off'); }
    setLocBusy(false);
  };

  const addFiles = async (files) => {
    const list = [...files].filter(f => /^(image|video)\//.test(f.type));
    if (!list.length) return;
    setUploading(n => n + list.length);
    for (const f of list) {
      const id = Store.uid();
      const thumb = await makeThumb(f);
      try { await Store.putMedia(id, f); } catch (e) { toast('儲存空間不足', 'error'); }
      const url = URL.createObjectURL(f); Store.cacheUrl(id, url);
      setR(o => ({ ...o, media: [...o.media.filter(m => !m.seed), { id, type: f.type.startsWith('video') ? 'video' : 'image', thumb, name: f.name }] }));
      setUploading(n => n - 1);
    }
  };
  const removeMedia = (id) => setR(o => ({ ...o, media: o.media.filter(m => m.id !== id) }));

  const valid = r.title.trim() && (r.kind === 'life' || r.place);
  const save = () => {
    if (!valid) { toast(r.title.trim() ? '請先選擇地點，或改成「生活紀錄」' : '幫這段回憶取個標題吧', 'edit'); return; }
    const out = { ...r, temp: r.temp === '' ? null : +r.temp, place: r.kind === 'life' ? null : r.place };
    if (out.media.length) { delete out.seedPhotos; delete out.seedVideos; }
    onSave(out);
  };

  const shown = r.media.length ? r.media : recMedia(r);
  const sec = { padding: '16px 16px 4px' };

  return (
    <Sheet title={isEdit ? '編輯回憶' : (r.kind === 'life' ? '新增生活紀錄' : '新增打卡')} onClose={onClose}
      headExtra={isEdit && <button className="btn danger sm" onClick={() => { if (confirm('確定要刪除這則回憶嗎？')) onDelete(r.id); }}><Ms n="delete" s={18} />刪除</button>}
      foot={<><button className="btn ghost" onClick={onClose} style={{ flex: 1 }}>取消</button><button className="btn primary" onClick={save} style={{ flex: 2 }}><Ms n="favorite" s={18} f />{isEdit ? '儲存修改' : '收進回憶裡'}</button></>}>
      <div style={{ padding: '14px 16px 0', display: 'flex', gap: 8 }}>
        {[['place', 'location_on', '有地點的打卡'], ['life', 'edit_note', '生活紀錄（無地點）']].map(([k, ic, l]) => (
          <button key={k} onClick={() => set('kind', k)} style={{ flex: 1, height: 48, borderRadius: 10, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, fontSize: 14.5, fontWeight: 700,
            background: r.kind === k ? 'var(--accent-l)' : 'var(--surface)', border: `1.5px solid ${r.kind === k ? 'var(--accent)' : 'var(--line)'}`, color: r.kind === k ? 'var(--accent-d)' : 'var(--sub)' }}>
            <Ms n={ic} s={20} f={r.kind === k} />{l}
          </button>
        ))}
      </div>

      {r.kind === 'place' && (
        <div style={sec}>
          <div className="label"><Ms n="pin_drop" s={16} />地點</div>
          {r.place ? (
            <div className="card" style={{ padding: 12, display: 'flex', gap: 12, alignItems: 'center', boxShadow: 'none' }}>
              <div style={{ width: 42, height: 42, borderRadius: 21, background: 'var(--accent-l)', color: 'var(--accent-d)', display: 'grid', placeItems: 'center', flexShrink: 0 }}><Ms n="location_on" s={22} f /></div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <input value={r.place.name} onChange={(e) => set('place', { ...r.place, name: e.target.value })} style={{ border: 0, outline: 0, background: 'none', fontWeight: 700, fontSize: 15.5, width: '100%', padding: 0 }} />
                <div className="muted" style={{ fontSize: 12.5, lineHeight: 1.45 }}>{r.place.addr || '—'}</div>
                <div className="muted" style={{ fontSize: 11.5, fontFamily: 'JetBrains Mono, monospace', marginTop: 2 }}>{r.place.lat.toFixed(5)}, {r.place.lng.toFixed(5)}</div>
              </div>
              <button className="btn ghost sm" onClick={() => set('place', null)}>更換</button>
            </div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              <button className="btn primary" onClick={locate} disabled={locBusy}><Ms n={locBusy ? "progress_activity" : "my_location"} s={20} className={locBusy ? "spin" : ""} />{locBusy ? '定位中…' : '精準定位我現在的位置'}</button>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, color: 'var(--faint)' }}><span style={{ flex: 1 }} className="dashed" />或搜尋地址・店家・地標<span style={{ flex: 1 }} className="dashed" /></div>
              <PlaceSearch compact onSelect={(p) => set('place', p)} />
            </div>
          )}
        </div>
      )}

      <div style={sec}>
        <div className="label"><Ms n="edit" s={16} />標題</div>
        <input className="field" value={r.title} onChange={(e) => set('title', e.target.value)} placeholder={r.kind === 'life' ? '例如：第一次一起組書櫃' : '例如：巷口那碗牛肉麵'} />
      </div>

      <div style={{ ...sec, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
        <div><div className="label"><Ms n="event" s={16} />日期</div><input type="date" className="field" value={r.date} onChange={(e) => set('date', e.target.value)} /></div>
        <div><div className="label"><Ms n="schedule" s={16} />時間</div><input type="time" className="field" value={r.time} onChange={(e) => set('time', e.target.value)} /></div>
      </div>
      {r.date && <div style={{ padding: '6px 16px 0', fontSize: 13, color: 'var(--accent-d)' }}><Ms n="favorite" s={14} f /> 這天是在一起的第 <b className="hand" style={{ fontSize: 19 }}>{nf(dayNoOf(r.date, settings.anniv))}</b> 天</div>}

      <div style={sec}>
        <div className="label"><Ms n="sell" s={16} />分類</div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>{Object.keys(CATS).map(c => <CatChip key={c} cat={c} on={r.cat === c} onClick={() => set('cat', c)} />)}</div>
      </div>

      <div style={sec}>
        <div className="label"><Ms n="photo_library" s={16} />照片與影片 <span style={{ marginLeft: 'auto', fontSize: 12 }}>{r.media.length ? `${r.media.length} 個檔案` : ''}</span></div>
        <div onDragOver={(e) => e.preventDefault()} onDrop={(e) => { e.preventDefault(); addFiles(e.dataTransfer.files); }}
          style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(88px, 1fr))', gap: 6 }}>
          <button onClick={() => fileRef.current.click()} style={{ aspectRatio: '1', borderRadius: 8, border: '1.5px dashed var(--accent)', background: 'var(--accent-l)', color: 'var(--accent-d)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 4, fontSize: 12.5 }}>
            <Ms n="add_photo_alternate" s={28} />{uploading ? `處理中 ${uploading}` : '新增照片/影片'}
          </button>
          {shown.map((m, i) => (
            <div key={m.id} style={{ position: 'relative', aspectRatio: '1' }}>
              <MediaTile m={m} rec={r} idx={i} style={{ width: '100%', height: '100%' }} cover={false} />
              {!m.seed && <button onClick={() => removeMedia(m.id)} style={{ position: 'absolute', top: 4, right: 4, width: 22, height: 22, borderRadius: 11, background: 'rgba(40,30,20,.6)', color: '#fff', display: 'grid', placeItems: 'center' }}><Ms n="close" s={14} /></button>}
              {i === 0 && <span style={{ position: 'absolute', left: 4, top: 4, fontSize: 10, background: 'var(--accent)', color: '#fff', padding: '2px 6px', borderRadius: 6 }}>封面</span>}

          ))}

      </div>

      <div style={sec}>
        <div className="label"><Ms n="partly_cloudy_day" s={16} />天氣</div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center' }}>
          {WEATHERS.map(([k, l]) => (
            <button key={k} onClick={() => set('weather', k)} className="chip" style={r.weather === k ? { background: 'var(--sky)', color: '#fff', borderColor: 'transparent' } : {}}><Ms n={k} s={17} />{l}</button>
          ))}
          <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}><input type="number" className="field" value={r.temp ?? ''} onChange={(e) => set('temp', e.target.value)} placeholder="溫度" style={{ width: 76, height: 34 }} /><span className="muted">°C</span></div>
        </div>
      </div>

      <div style={sec}>
        <div className="label"><Ms n="mood" s={16} />心情貼紙</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 6 }}>
          {MOODS.map(([l, ic, c]) => (
            <button key={l} onClick={() => set('mood', l)} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, padding: '8px 0', borderRadius: 10, fontSize: 12,
              background: r.mood === l ? c + '2E' : 'var(--surface)', border: `1.5px solid ${r.mood === l ? c : 'var(--line)'}`, transform: r.mood === l ? 'rotate(-4deg) scale(1.04)' : 'none', transition: 'all .2s cubic-bezier(.3,1.6,.5,1)' }}>
              <Ms n={ic} s={26} f style={{ color: c }} />{l}
            </button>
          ))}
        </div>
      </div>

      <div style={sec}>
        <div className="label"><Ms n="favorite" s={16} />喜歡程度</div>
        <Hearts n={r.rating} s={30} onChange={(v) => set('rating', v)} />
      </div>

      <div style={{ ...sec, paddingBottom: 24 }}>
        <div className="label"><Ms n="history_edu" s={16} />心得記事 <span style={{ marginLeft: 'auto', fontSize: 12 }}>可以現在寫，也可以之後再補</span></div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {[['her', settings.her, 'var(--her)', '妳想說的話…'], ['me', settings.me, 'var(--me)', '我想說的話…']].map(([k, who, c, ph]) => (
            <div key={k} style={{ position: 'relative' }}>
              <span style={{ position: 'absolute', left: 10, top: -8, fontSize: 11, fontWeight: 700, color: '#fff', background: c, borderRadius: 8, padding: '2px 8px', zIndex: 1 }}>{who}</span>
              <textarea className="field" rows={3} value={r[k] || ''} onChange={(e) => set(k, e.target.value)} placeholder={ph} style={{ paddingTop: 16, background: 'repeating-linear-gradient(transparent 0 25px, var(--line) 25px 26px), var(--surface)', backgroundPosition: '0 9px' }} />
            </div>
          ))}
        </div>
      </div>
    </Sheet>
  );
}

function Lightbox({ items, index, rec, onClose }) {
  const [i, setI] = React.useState(index);
  const m = items[i];
  const url = useMediaUrl(m && !m.seed ? m.id : null);
  React.useEffect(() => {
    const h = (e) => { if (e.key === 'Escape') onClose(); if (e.key === 'ArrowRight') setI(x => Math.min(items.length - 1, x + 1)); if (e.key === 'ArrowLeft') setI(x => Math.max(0, x - 1)); };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  }, [items.length]);
  const nav = (d) => setI(x => Math.max(0, Math.min(items.length - 1, x + d)));
  return ReactDOM.createPortal(
    <div className="lightbox" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {m.seed ? (
          <div className="ph" style={{ '--c': catC(rec.cat), width: 'min(80vw, 720px)', aspectRatio: '4/3', borderRadius: 4 }}>
            <span className="ph-l" style={{ fontSize: 12 }}>{m.type === 'video' ? '影片' : '照片'} {i + 1} ・ 示意佔位（上傳後會顯示真實檔案）</span>
          </div>
        ) : m.type === 'video' ? (url && <video src={url} controls autoPlay playsInline />) : (url && <img src={url} alt="" />)}
      </div>
      <button onClick={onClose} style={{ position: 'absolute', top: 16, right: 16, zIndex: 2010 }} className="icon-btn" ><Ms n="close" s={22} style={{ color: 'var(--ink)' }} /></button>
      {i > 0 && <button onClick={(e) => { e.stopPropagation(); nav(-1); }} className="icon-btn" style={{ position: 'absolute', left: 16, top: '50%', zIndex: 2010 }}><Ms n="chevron_left" s={26} /></button>}
      {i < items.length - 1 && <button onClick={(e) => { e.stopPropagation(); nav(1); }} className="icon-btn" style={{ position: 'absolute', right: 16, top: '50%', zIndex: 2010 }}><Ms n="chevron_right" s={26} /></button>}
      <div style={{ position: 'absolute', bottom: 20, left: 0, right: 0, textAlign: 'center', color: '#fff', fontSize: 14, zIndex: 2010 }}>{rec.title}・{i + 1} / {items.length}</div>
    </div>, document.body);
}

function Gallery({ r, onOpen, h = 260 }) {
  const m = recMedia(r);
  if (!m.length) return (
    <div className="ph" style={{ '--c': catC(r.cat), height: h * .6, borderRadius: 8, display: 'grid', placeItems: 'center' }}>
      <span className="muted" style={{ fontSize: 13 }}>還沒有照片，按「編輯」補上吧</span>
    </div>
  );
  const more = m.length - 5;
  return (
    <div style={{ display: 'grid', gridTemplateColumns: m.length === 1 ? '1fr' : '2fr 1fr 1fr', gridTemplateRows: `${h / 2 - 2}px ${h / 2 - 2}px`, gap: 4 }}>
      {m.slice(0, 5).map((x, i) => (
        <MediaTile key={x.id} m={x} rec={r} idx={i} onClick={() => onOpen(i)}
          style={{ gridRow: i === 0 ? 'span 2' : undefined, height: '100%', borderRadius: 6 }}
          label={i === 4 && more > 0 ? `+${more}` : null} />
      ))}
    </div>
  );
}

    <div>
      {groups.map(g => (
        <div key={g.k}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, margin: '10px 0 16px' }}>

                  {desk && <div style={{ fontSize: 11.5, color: 'var(--accent-d)', marginTop: 4 }}>第 {nf(dayNoOf(r.date, settings.anniv))} 天</div>}

                    </div>

                  <div style={{ minWidth: 0 }}>

                    </div>
                    <div style={{ fontWeight: 700, fontSize: desk ? 19 : 16, lineHeight: 1.35, marginBottom: 4, textWrap: 'pretty' }}>{r.title}</div>
                    <div className="muted" style={{ fontSize: 12.5, marginBottom: 8, display: 'flex', alignItems: 'center', gap: 3 }}><Ms n={r.place ? 'location_on' : 'edit_note'} s={15} />{r.place ? r.place.name : '生活紀錄'}</div>

function TLPolaroid({ list, onOpen, desk }) {
  const tapes = ['var(--honey)', 'var(--accent)', 'var(--rose)', 'var(--sky)'];
  const cols = desk ? 4 : 2;
  const colsArr = Array.from({ length: cols }, () => []);

function MonthGrid({ y, m, list, onOpen, selDay, onSel, desk }) {
  const first = new Date(y, m - 1, 1).getDay(); const days = new Date(y, m, 0).getDate();
  const key = `${y}-${pad2(m)}`;
  const recs = list.filter(r => r.date.startsWith(key));
  const cells = []; for (let i = 0; i < first; i++) cells.push(null); for (let d = 1; d <= days; d++) cells.push(d);
  const today = new Date(); const isToday = (d) => today.getFullYear() === y && today.getMonth() + 1 === m && today.getDate() === d;
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4 }}>
      {WEEK.map(w => <div key={w} style={{ textAlign: 'center', fontSize: 12, color: 'var(--sub)', lineHeight: '24px' }}>{w}</div>)}
      {cells.map((d, i) => {
        const dr = d ? recs.filter(r => +r.date.slice(8) === d) : [];
        const r = dr[0]; const th = r && firstThumb(r);
        const sel = selDay === d;
        return (
          <button key={i} disabled={!d} onClick={() => d && onSel(d)} style={{ height: desk ? 76 : 48, borderRadius: 6, position: 'relative', overflow: 'hidden', cursor: d ? 'pointer' : 'default',
            background: r ? (th ? `center/cover url(${th})` : `repeating-linear-gradient(135deg, ${catC(r.cat)}66 0 5px, ${catC(r.cat)}2A 5px 10px)`) : (d ? 'var(--surface)' : 'transparent'),
            outline: sel ? '2px solid var(--ink)' : (isToday(d) ? '2px solid var(--accent)' : 'none'), outlineOffset: -2, border: d && !r ? '1px solid var(--line)' : 0 }}>
            {d && <span style={{ position: 'absolute', left: 5, top: 4, fontSize: 12, fontWeight: r ? 700 : 400, color: r ? 'var(--ink)' : 'var(--sub)', background: th ? 'rgba(255,251,243,.85)' : 'none', borderRadius: 4, padding: th ? '0 3px' : 0 }}>{d}</span>}
            {r && <span style={{ position: 'absolute', right: 3, bottom: 3, width: 18, height: 18, borderRadius: 9, background: catC(r.cat), color: '#fff', display: 'grid', placeItems: 'center' }}><Ms n={catI(r.cat)} s={12} f /></span>}
            {dr.length > 1 && <span style={{ position: 'absolute', left: 4, bottom: 3, fontSize: 10, fontWeight: 700 }}>+{dr.length - 1}</span>}
          </button>
        );
      })}
    </div>
  );
}

function TLCalendar({ list, onOpen, desk }) {
  const latest = list[0] ? parseD(list[0].date) : new Date();
  const [ym, setYm] = React.useState({ y: latest.getFullYear(), m: latest.getMonth() + 1 });
  const [sel, setSel] = React.useState(null);
  const shift = (d) => { setSel(null); setYm(({ y, m }) => { let nm = m + d, ny = y; if (nm < 1) { nm = 12; ny--; } if (nm > 12) { nm = 1; ny++; } return { y: ny, m: nm }; }); };
  const key = `${ym.y}-${pad2(ym.m)}`;
  const monthRecs = list.filter(r => r.date.startsWith(key));
  const shown = sel ? monthRecs.filter(r => +r.date.slice(8) === sel) : monthRecs;
  return (
    <div style={{ display: 'grid', gridTemplateColumns: desk ? '1.4fr 1fr' : '1fr', gap: 18, paddingTop: 8, alignItems: 'start' }}>
      <div className="card" style={{ padding: desk ? 18 : 12 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
          <button className="icon-btn" style={{ width: 36, height: 36, boxShadow: 'none' }} onClick={() => shift(-1)}><Ms n="chevron_left" s={22} /></button>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontWeight: 700, fontSize: 19 }}>{ym.y} 年 {ym.m} 月</div>
            <div className="muted" style={{ fontSize: 12 }}>{monthRecs.length} 則回憶</div>
          </div>
          <button className="icon-btn" style={{ width: 36, height: 36, boxShadow: 'none' }} onClick={() => shift(1)}><Ms n="chevron_right" s={22} /></button>
        </div>
        <MonthGrid y={ym.y} m={ym.m} list={list} selDay={sel} onSel={(d) => setSel(sel === d ? null : d)} desk={desk} />
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        <div className="muted" style={{ fontSize: 13 }}>{sel ? `${ym.m} 月 ${sel} 日` : `${ym.m} 月的我們`}</div>
        {shown.length === 0 && <div className="card" style={{ padding: 20, textAlign: 'center', color: 'var(--sub)', fontSize: 14, boxShadow: 'none' }}>{sel ? '這天沒有紀錄' : '這個月還沒有紀錄，翻翻其他月份吧'}</div>}
        {shown.map(r => (
          <button key={r.id} className="card fade-in" onClick={() => onOpen(r)} style={{ padding: 10, display: 'flex', gap: 12, alignItems: 'center', textAlign: 'left' }}>
            <MediaTile m={recMedia(r)[0]} rec={r} style={{ width: 60, height: 60, flexShrink: 0 }} />
            <div style={{ minWidth: 0, flex: 1 }}>
              <div style={{ fontSize: 12, color: catC(r.cat), fontWeight: 700, marginBottom: 3 }}>{fmt(r.date).md}・{r.cat}</div>
              <div className="ellipsis" style={{ fontWeight: 700, fontSize: 15 }}>{r.title}</div>
              <div className="muted ellipsis" style={{ fontSize: 12 }}>{r.place ? r.place.name : '生活紀錄'}</div>
            </div>
            <Hearts n={r.rating} s={12} />
          </button>
        ))}
      </div>
    </div>
  );
}

function Stats({ list, desk }) {
  const places = new Set(list.filter(r => r.place).map(r => r.place.name)).size;
  let p = 0, v = 0, w = 0; list.forEach(r => { const c = mediaCount(r); p += c.p; v += c.v; if (r.her || r.me) w++; });

  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: desk ? 12 : 6 }}>

        <div key={l} className="card" style={{ padding: desk ? '12px 16px' : '8px 4px', display: 'flex', alignItems: 'center', justifyContent: desk ? 'flex-start' : 'center', gap: 10, boxShadow: 'none', textAlign: desk ? 'left' : 'center' }}>
          {desk && <Ms n={ic} s={26} style={{ color: c }} />}
          <div><div className="hand" style={{ fontSize: desk ? 28 : 22, fontWeight: 700, lineHeight: 1 }}>{n}</div><div className="muted" style={{ fontSize: desk ? 12.5 : 11 }}>{l}</div></div>

function onThisDay(records) {
  const t = new Date(); const md = `-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())}`;
  return sortRecs(records.filter(r => r.date.endsWith(md) && +r.date.slice(0, 4) < t.getFullYear()));
}

function OnThisDay({ records, onOpen, compact }) {
  const list = onThisDay(records);
  if (!list.length) return null;
  const r = list[0]; const yrs = new Date().getFullYear() - +r.date.slice(0, 4);
  return (
    <button onClick={() => onOpen(r)} className="fade-in" style={{ display: 'flex', gap: 12, alignItems: 'center', padding: compact ? 10 : 12, borderRadius: 10, background: 'color-mix(in oklab, var(--honey) 22%, var(--surface))', border: '1px solid color-mix(in oklab, var(--honey) 45%, var(--line))', textAlign: 'left', width: '100%', position: 'relative' }}>
      <Tape color="var(--rose)" style={{ top: -7, right: 18, width: 46, height: 14, transform: 'rotate(8deg)' }} />
      <MediaTile m={recMedia(r)[0]} rec={r} style={{ width: compact ? 48 : 60, height: compact ? 48 : 60, flexShrink: 0 }} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: '#A97B2C', display: 'flex', alignItems: 'center', gap: 3, marginBottom: 3 }}><Ms n="history" s={15} />{yrs === 1 ? '去年的今天' : `${yrs} 年前的今天`}</div>
        <div className="ellipsis" style={{ fontWeight: 700, fontSize: 15 }}>{r.title}</div>
        <div className="muted ellipsis" style={{ fontSize: 12 }}>{fmt(r.date).full}・{r.place ? r.place.name : '生活紀錄'}</div>

}

function MapView({ records, settings, base, setBase, onOpen, onAdd, focus }) {
  const desk = useIsDesk();
  const toast = useToast();
  const [cat, setCat] = React.useState(null);
  const [active, setActive] = React.useState(null);
  const [fly, setFly] = React.useState(null);
  const [me, setMe] = React.useState(null);
  const [found, setFound] = React.useState(null);
  const [locBusy, setLocBusy] = React.useState(false);
  const [bounds, setBounds] = React.useState(null);
  const [onlyView, setOnlyView] = React.useState(false);
  const list = sortRecs(records).filter(r => r.place && (!cat || r.cat === cat));
  const sideList = onlyView ? list.filter(r => !bounds || bounds.contains([r.place.lat, r.place.lng])) : list;
  const activeRec = records.find(r => r.id === active);

  React.useEffect(() => { if (focus) { setActive(focus.id); setFly({ lat: focus.place.lat, lng: focus.place.lng, zoom: 16, k: Date.now() }); } }, [focus]);

  const pick = (id) => { const r = records.find(x => x.id === id); setActive(id); setFound(null); if (r) setFly({ lat: r.place.lat, lng: r.place.lng, k: Date.now() }); };
  const locate = async () => {
    setLocBusy(true);
    try {
      const p = await Geo.locate(); setMe(p); setFly({ lat: p.lat, lng: p.lng, zoom: 17, k: Date.now() });
      const info = await Geo.reverse(p.lat, p.lng);
      setFound({ ...info, lat: p.lat, lng: p.lng, acc: p.acc, isMe: true }); setActive(null);
    } catch (e) { toast(e.code === 1 ? '請允許瀏覽器存取位置' : '定位失敗，可改用搜尋', 'location_off'); }
    setLocBusy(false);
  };
  const onSelectPlace = (p) => { setFound(p); setActive(null); setFly({ lat: p.lat, lng: p.lng, zoom: 17, k: Date.now() }); };

  const foundCard = found && (
    <div className="card fade-in" style={{ padding: 14, boxShadow: 'var(--shadow-l)', width: desk ? 360 : 'auto' }}>
      <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
        <div style={{ width: 40, height: 40, borderRadius: 20, background: 'var(--accent-l)', color: 'var(--accent-d)', display: 'grid', placeItems: 'center', flexShrink: 0 }}><Ms n={found.isMe ? 'my_location' : 'location_on'} s={22} f /></div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="muted" style={{ fontSize: 12 }}>{found.isMe ? `你在這裡（誤差約 ${Math.round(found.acc)} 公尺）` : '搜尋到的地點'}・可拖曳圖針微調</div>
          <div style={{ fontWeight: 700, fontSize: 17 }}>{found.name}</div>
          <div className="muted" style={{ fontSize: 12.5, lineHeight: 1.45 }}>{found.addr}</div>
          <div className="muted" style={{ fontSize: 11.5, fontFamily: 'JetBrains Mono, monospace' }}>{found.lat.toFixed(5)}, {found.lng.toFixed(5)}</div>
        </div>
        <button onClick={() => setFound(null)} style={{ color: 'var(--faint)', display: 'grid' }}><Ms n="close" s={20} /></button>
      </div>
      <button className="btn primary" style={{ width: '100%', marginTop: 12 }} onClick={() => { onAdd({ place: { name: found.name, addr: found.addr, lat: found.lat, lng: found.lng } }); setFound(null); }}><Ms n="add_location_alt" s={20} />在這裡打卡</button>
    </div>
  );

  const map = (
    <UsMap records={list} activeId={active} onPick={pick} base={base} flyTo={fly} me={me}
      draft={found} onDraftMove={(ll) => setFound(f => ({ ...f, lat: ll.lat, lng: ll.lng }))}
      onMapClick={() => { setActive(null); }} onBoundsChange={setBounds}
      padBottom={desk ? 0 : 260} padLeft={0} />
  );

  const baseSwitch = (
    <div className="seg" style={{ boxShadow: '0 4px 12px rgba(75,58,47,.1)' }}>
      {[['theme', '主題底圖'], ['street', '明亮街道']].map(([k, l]) => <button key={k} className={base === k ? 'on' : ''} onClick={() => setBase(k)}>{l}</button>)}
    </div>
  );

  if (desk) return (
    <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
      <aside style={{ width: 390, flexShrink: 0, background: 'var(--surface)', borderRight: '1px solid var(--line)', display: 'flex', flexDirection: 'column', minHeight: 0 }}>
        <div style={{ padding: '18px 18px 10px', display: 'flex', flexDirection: 'column', gap: 10 }}>
          <div style={{ display: 'flex', gap: 8 }}>
            <PlaceSearch records={records} onSelect={onSelectPlace} onRecord={(r) => r.place ? pick(r.id) : onOpen(r)} />
            <button className="icon-btn accent" title="精準定位" onClick={locate} style={{ height: 46, width: 46, borderRadius: 12 }} disabled={locBusy}><Ms n={locBusy ? 'progress_activity' : 'my_location'} s={22} className={locBusy ? 'spin' : ''} /></button>
          </div>
          <CatFilter value={cat} onChange={setCat} />
          <OnThisDay records={records} onOpen={onOpen} compact />
        </div>
        <div style={{ padding: '4px 18px 6px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12.5 }}>
          <span className="muted">{sideList.length} 個地方</span>
          <label style={{ display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer', color: 'var(--sub)' }}>
            <input type="checkbox" checked={onlyView} onChange={(e) => setOnlyView(e.target.checked)} style={{ accentColor: 'var(--accent)' }} />只看地圖範圍內
          </label>
        </div>
        <div className="scroll" style={{ flex: 1, padding: '0 10px 16px' }}>
          {sideList.map(r => <RecRow key={r.id} r={r} on={r.id === active} onClick={() => pick(r.id)} settings={settings} />)}
          {sideList.length === 0 && <div className="muted" style={{ textAlign: 'center', padding: 30, fontSize: 14 }}>這個範圍內還沒有足跡</div>}
        </div>
      </aside>
      <div style={{ flex: 1, position: 'relative' }}>
        {map}
        <div style={{ position: 'absolute', top: 16, left: 16, zIndex: 500 }}>{baseSwitch}</div>
        <div style={{ position: 'absolute', top: 16, right: 16, zIndex: 500 }}>

const addDaysIso = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return Store.iso(d); };
const daysUntil = (iso) => { const t = new Date(); const t0 = new Date(t.getFullYear(), t.getMonth(), t.getDate()); return Math.round((parseD(iso) - t0) / DAYMS); };
const dueText = (n) => n === 0 ? '就是今天' : n === 1 ? '明天' : n > 1 ? `還有 ${n} 天` : `已過 ${-n} 天`;
const partnerOf = (who) => (who === 'me' ? 'her' : 'me');
function agoText(ts) {
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return '剛剛'; if (m < 60) return `${m} 分鐘前`;
  const h = Math.floor(m / 60); if (h < 24) return `${h} 小時前`;
  const d = Math.floor(h / 24); if (d < 7) return `${d} 天前`;
  const x = new Date(ts); return `${x.getMonth() + 1}/${x.getDate()}`;
}

const BoardStore = {
  load() {
    try { const s = JSON.parse(localStorage.getItem(BOARD_LS)); if (Array.isArray(s)) return s; } catch (e) {}
    const s = boardSeed(); this.save(s); return s;
  },
  save(list) { try { localStorage.setItem(BOARD_LS, JSON.stringify(list)); } catch (e) {} },
  seen(who) { return +localStorage.getItem('us-board-seen-' + who) || 0; },
  setSeen(who, t) { localStorage.setItem('us-board-seen-' + who, String(t)); },
  reset() { localStorage.removeItem(BOARD_LS); return this.load(); },
};

function isUnread(it, who, seen) {
  if (seen == null) return false;
  if (it.author !== who && it.createdAt > seen) return true;
  if ((it.replies || []).some(r => r.author !== who && r.at > seen)) return true;
  if (it.rsvpBy && it.rsvpBy !== who && it.rsvpAt > seen) return true;
  return false;
}
function upcomingOf(list) {
  return list.filter(it => it.date && !it.done && !it.memorized && it.status !== 'no')
    .map(it => ({ it, n: daysUntil(it.date) })).filter(x => x.n >= 0 && x.n <= 7).sort((a, b) => a.n - b.n);
}

function Who({ a, settings, sm }) {
  return <span className="who-chip" style={{ background: a === 'her' ? 'var(--her)' : 'var(--me)', fontSize: sm ? 10.5 : 11.5 }}>{settings[a]}</span>;
}
function DueChip({ date, time, done }) {
  if (!date) return null;
  const n = daysUntil(date); const soon = !done && n >= 0 && n <= 7; const over = !done && n < 0;
  return (
    <span className={'due-chip' + (soon ? ' soon' : '') + (over ? ' over' : '')}>
      <Ms n={soon ? 'notifications' : 'event'} s={13} f={soon} />{fmt(date).md}{time ? ' ' + time : ''}{soon || over ? `・${dueText(n)}` : ''}
    </span>
  );
}
function DateBlock({ date, big }) {
  if (!date) return <div className="date-block empty" style={big ? { width: 84 } : {}}><Ms n="event" s={22} /><span>日期未定</span></div>;
  const f = fmt(date);
  return (
    <div className="date-block" style={big ? { width: 84 } : {}}>
      <div className="db-m">{f.m} 月</div>
      <div className="db-d hand" style={big ? { fontSize: 42 } : {}}>{f.d}</div>
      <div className="db-w">週{f.wk}</div>
    </div>
  );
}
const NewTag = () => <span className="new-tag">NEW</span>;
const stop = (fn) => (e) => { e.stopPropagation(); fn(e); };

function Rsvp({ it, who, settings, onRsvp, onMemorize }) {
  const partner = partnerOf(who);
  const past = it.date && daysUntil(it.date) < 0;
  if (it.memorized) return <span className="st-chip"><Ms n="auto_stories" s={15} />已收進回憶</span>;
  if (it.status === 'yes' && past) return <button className="btn primary sm" style={{ boxShadow: 'none' }} onClick={stop(() => onMemorize(it))}><Ms n="edit_note" s={17} />約會完成，寫成回憶</button>;
  if (it.status === 'yes') return <span className="stamp"><Ms n="favorite" s={15} f />約好了</span>;
  if (it.author !== who) {
    return (
      <div className="rsvp" onClick={(e) => e.stopPropagation()}>
        {[['yes', 'favorite', '好呀！'], ['maybe', 'help', '再想想'], ['no', 'schedule', '改天吧']].map(([k, ic, l]) => (
          <button key={k} className={(it.status === k ? 'on ' : '') + k} onClick={() => onRsvp(it.id, k)}><Ms n={ic} s={15} f={it.status === k} />{l}</button>
        ))}
      </div>
    );
  }
  if (it.status === 'maybe') return <span className="st-chip"><Ms n="help" s={15} />{settings[partner]} 說再想想</span>;
  if (it.status === 'no') return <span className="st-chip"><Ms n="schedule" s={15} />{settings[partner]} 說改天吧</span>;
  return <span className="st-chip"><Ms n="hourglass_top" s={15} />等 {settings[partner]} 回覆中⋯</span>;
}

function StickyNote({ it, settings, isNew, onOpen }) {
  const rot = ((it.id.charCodeAt(0) + it.id.charCodeAt(2)) % 5 - 2) * 0.9;

      <Tape color={tapes[it.id.charCodeAt(1) % 4]} style={{ top: -8, left: '50%', marginLeft: -28, width: 56, height: 16, transform: `rotate(${-rot * 2}deg)` }} />

function BoardDetail({ it, who, settings, onClose, onEdit, onDelete, onToggle, onRsvp, onReply, onMemorize }) {
